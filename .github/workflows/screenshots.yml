name: Capture UI screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'worker/**'
      - 'shared/**'
      - 'migrations/**'
      - 'fixtures/**'
      - 'scripts/capture-screenshots.mjs'
      - 'package.json'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write

concurrency:
  group: my-petition-screenshots
  cancel-in-progress: true

jobs:
  capture:
    if: github.repository == 'theworker02/my-petition'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install
      - name: Build UI assets for Wrangler
        run: npm run build
      - name: Install screenshot runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Set up isolated local database
        run: |
          npm run db:local
          npx wrangler d1 execute my-petition-db --local --file=fixtures/screenshot-seed.sql
      - name: Start app and capture real UI
        run: |
          npm run dev > /tmp/my-petition-dev.log 2>&1 &
          node scripts/capture-screenshots.mjs || { cat /tmp/my-petition-dev.log; exit 1; }
      - name: Upload screenshots as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-petition-ui-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
      - name: Publish screenshots to README gallery
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh real UI screenshots [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
