name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-petition-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      EMAIL_OTP_SECRET: ${{ secrets.EMAIL_OTP_SECRET }}
      AUDIT_HASH_SECRET: ${{ secrets.AUDIT_HASH_SECRET }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      MODERATOR_EMAILS: ${{ vars.MODERATOR_EMAILS }}
      SITE_SUPPORT_EMAIL: ${{ vars.SITE_SUPPORT_EMAIL }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build and typecheck
        run: npm run build
      - name: Validate Worker and D1 locally
        run: |
          npm run db:local
          npm run test:smoke
      - name: Validate deployment prerequisites
        run: node scripts/prepare-production.mjs
      - name: Dry-run production Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.production.jsonc --secrets-file .secrets.production.json
      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply my-petition-db --remote --config wrangler.production.jsonc
      - name: Deploy code, static assets and secrets together
        id: deployment
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.production.jsonc --secrets-file .secrets.production.json 2>&1 | tee /tmp/my-petition-deploy.log
          URL="${{ vars.PRODUCTION_BASE_URL }}"
          if [[ -z "$URL" ]]; then
            URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/my-petition-deploy.log | head -n 1 || true)
          fi
          if [[ -z "$URL" ]]; then
            echo "::error::Could not determine deployed URL. Set PRODUCTION_BASE_URL and verify manually."
            exit 1
          fi
          echo "site_url=$URL" >> "$GITHUB_OUTPUT"
      - name: Verify public production readiness
        env:
          SITE_URL: ${{ steps.deployment.outputs.site_url }}
        run: |
          node -e 'fetch(new URL("/api/ready",process.env.SITE_URL)).then(async r=>{const d=await r.json();if(!r.ok||d.ready!==true||d.production!==true)throw Error("Production failed readiness check");console.log("Live readiness verified");}).catch(e=>{console.error(e.message);process.exit(1);})'
      - name: Remove temporary configuration and secrets
        if: always()
        run: rm -f wrangler.production.jsonc .secrets.production.json
