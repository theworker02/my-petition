name: Generate dependency lockfile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lockfile.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: my-petition-lockfile
  cancel-in-progress: false

jobs:
  lock:
    if: github.repository == 'theworker02/my-petition'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile without running dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile for reproducible builds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock npm dependencies [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
